name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (e.g. 1.0.1). Ignored when run from a tag."
        required: true
        type: string
      draft:
        description: "Create a draft GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-13
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
          fi
          if [[ -z "$VER" ]]; then
            echo "Version is empty" >&2
            exit 1
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish zip
        shell: pwsh
        run: ./scripts/Publish-Dustan.ps1 -Runtime ${{ matrix.rid }} -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: Dustan-${{ matrix.rid }}
          path: artifacts/Dustan-*-${{ matrix.rid }}.zip
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
            TAG="v$VER"
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=${{ github.event.inputs.draft || false }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Dustan-*
          merge-multiple: true

      - name: Collect zip assets
        run: |
          mkdir -p assets
          find dist -name '*.zip' -print -exec cp {} assets/ \;
          ls -la assets
          test -n "$(ls -A assets/*.zip 2>/dev/null)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dustan ${{ steps.version.outputs.value }}
          draft: ${{ steps.version.outputs.draft == 'true' }}
          generate_release_notes: true
          files: assets/*.zip
          fail_on_unmatched_files: true
          make_latest: true
