name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (e.g. 1.0.1). Ignored when run from a tag."
        required: true
        type: string
      draft:
        description: "Create a draft GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
          fi
          if [[ -z "$VER" ]]; then
            echo "Version is empty" >&2
            exit 1
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Install libmpv and build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libmpv-dev libgl-dev libxkbcommon-dev

      - name: Install libmpv and build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ninja pkgconf

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Fetch libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv-windows.ps1 -Destination deps/mpv

      - name: Build and package
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            args+=(-DMPV_DIR="$GITHUB_WORKSPACE/deps/mpv" -DMPV_RUNTIME="$GITHUB_WORKSPACE/deps/mpv/libmpv-2.dll")
          fi
          ./scripts/package-qt.sh "${{ steps.version.outputs.value }}" "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: Dustan-${{ matrix.rid }}
          path: |
            artifacts/Dustan-*-${{ matrix.rid }}.zip
            artifacts/Dustan-*-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
            TAG="v$VER"
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=${{ github.event.inputs.draft || false }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Dustan-*
          merge-multiple: true

      - name: Collect archives
        run: |
          mkdir -p assets
          find dist \( -name '*.zip' -o -name '*.tar.gz' \) -print -exec cp {} assets/ \;
          ls -la assets
          test -n "$(ls -A assets 2>/dev/null)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dustan ${{ steps.version.outputs.value }}
          draft: ${{ steps.version.outputs.draft == 'true' }}
          generate_release_notes: true
          files: assets/*
          fail_on_unmatched_files: true
          make_latest: true
